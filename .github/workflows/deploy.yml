# 山ノートを GitHub Pages に公開するワークフロー
# 初回のみ: リポジトリの Settings → Pages → Build and deployment → Source を「GitHub Actions」にする
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, 'claude/mountain-climbing-app-jq2jkm']
  workflow_dispatch:
  # 標高更新ワークフローのコミットは GITHUB_TOKEN による push なので push トリガーが動かない。完了後にデプロイする
  workflow_run:
    workflows: ['Update mountain elevations']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
